<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eSentinel Demo · Booth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { display: flex; flex-direction: column;
         font-family: "Inter", ui-sans-serif, system-ui, sans-serif; }
  #show { flex: 1 1 0; min-height: 0; border: 0; width: 100%; }
  #bar {
    flex: none; height: 148px; padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255, 255, 255, .09); background: #000;
  }
  #bar .mark { font-family: Georgia, "Times New Roman", serif; font-weight: 600;
               font-size: 30px; color: rgba(255, 255, 255, .78); }
  #bar .mark::after { content: ""; display: block; height: 2px; width: 100%;
                      margin-top: 7px; background: #0099ff; }
  #bar .contact { display: flex; align-items: center; gap: 34px; }
  #bar .lines { text-align: right; }
  #bar .who { font-weight: 700; font-size: 27px; color: #fff; letter-spacing: -.01em; }
  #bar .how { margin-top: 9px; font-family: "SFMono-Regular", ui-monospace, Menlo, monospace;
              font-size: 20px; letter-spacing: .06em; color: rgba(255, 255, 255, .62); }
  #bar .qr { width: 118px; height: 118px; padding: 8px; background: #f2ede3; border-radius: 12px; }
  #bar .qr img { width: 100%; height: 100%; display: block; }
</style>
</head>
